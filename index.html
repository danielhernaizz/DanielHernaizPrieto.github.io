<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding-top: 40px;
        }
        .caja-principal {
            background-color: white;
            width: 550px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .big {
            color: #0066cc;
            font-size: 18px;
            height: 25px;
        }
        input {
            font-size: 16px;
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        .seccion {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        button {
            font-size: 14px;
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
            background-color: #e9e9e9;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        button:hover {
            background-color: #d0d0d0;
        }
        button:focus {
            outline: 2px solid #0066cc;
        }
        .boton-igual {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            width: 200px;
            padding: 10px;
            margin-top: 10px;
        }
        .boton-igual:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="caja-principal">
        <h1>Mi Calculadora</h1>
        
        <h2 id="info" class="big" title="Información sobre el número">Información sobre el número</h2>
        
        <input type="text" id="n1" placeholder="Introduce número o CSV">
        
        <div class="seccion">
            <button id="square">x² (Cuadrado)</button>
            <button id="modulo">Módulo</button>
            <button id="factorial">Factorial</button>
            <button id="raiz">Raíz</button>
        </div>
        
        <div class="seccion">
            <button id="suma">Suma (+)</button>
            <button id="multiplicacion">Multiplicación (*)</button>
            <button id="potencia">Potencia</button>
            <br>
            <button id="eq" class="boton-igual">Igual (=)</button>
        </div>
        
        <div class="seccion">
            <button id="csvSum">Sumar CSV</button>
            <button id="csvMedia">Media CSV</button>
            <button id="csvSort">Ordenar CSV</button>
            <button id="csvReverse">Invertir CSV</button>
            <button id="csvRemove">Borrar último</button>
        </div>
    </div>

    <script>
        let numero1 = 0;
        let operacion = "";

        const fill_info = (mensaje) => {
            document.getElementById("info").innerHTML = mensaje;
        };

        const validate = () => {
            let valor = document.getElementById("n1").value;
            if (valor === "") {
                fill_info("Error: El campo está vacío");
                return false;
            }
            return true;
        };

        const square = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                let res = num * num;
                document.getElementById("n1").value = res;
                
                if (res < 100) {
                    fill_info("Info: El resultado es menor que 100");
                } else if (res >= 100 && res <= 200) {
                    fill_info("Info: El resultado está entre 100 y 200");
                } else {
                    fill_info("Info: El resultado es mayor que 200");
                }
            }
        };

        const mod = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                if (num < 0) {
                    num = -num;
                }
                document.getElementById("n1").value = num;
                fill_info("Operación: Módulo. El resultado es " + num);
            }
        };

        const fact = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num) || num < 0 || !Number.isInteger(num)) {
                    fill_info("Error: El factorial debe ser de un número entero positivo");
                    return;
                }
                let res = 1;
                for (let i = num; i > 1; i--) {
                    res = res * i;
                }
                document.getElementById("n1").value = res;
                fill_info("Operación: Factorial. El resultado es " + res);
            }
        };

        const raiz = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                if (num < 0) {
                    fill_info("Error: No se puede hacer la raíz de un número negativo");
                    return;
                }
                let res = Math.sqrt(num);
                document.getElementById("n1").value = res;
                fill_info("Operación: Raíz. El resultado es " + res);
            }
        };

        const suma = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                numero1 = num;
                operacion = "+";
                document.getElementById("n1").value = "";
                fill_info("Operación: Suma. Introduce el segundo número");
            }
        };

        const multiplicacion = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                numero1 = num;
                operacion = "*";
                document.getElementById("n1").value = "";
                fill_info("Operación: Multiplicación. Introduce el segundo número");
            }
        };

        const potencia = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                numero1 = num;
                operacion = "^";
                document.getElementById("n1").value = "";
                fill_info("Operación: Potencia. Introduce el segundo número");
            }
        };

        const eq = () => {
            if (validate()) {
                let numero2 = Number(document.getElementById("n1").value);
                if (isNaN(numero2)) {
                    fill_info("Error: Introduce un número válido");
                    return;
                }
                let res = 0;
                let nombre = "";
                if (operacion === "+") {
                    res = numero1 + numero2;
                    nombre = "Suma";
                } else if (operacion === "*") {
                    res = numero1 * numero2;
                    nombre = "Multiplicación";
                } else if (operacion === "^") {
                    res = Math.pow(numero1, numero2);
                    nombre = "Potencia";
                } else {
                    fill_info("Error: Tienes que elegir una operación primero");
                    return;
                }
                document.getElementById("n1").value = res;
                fill_info("Operación: " + nombre + ". El resultado es " + res);
                operacion = "";
            }
        };

        const sumarCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                let total = 0;
                for (let i = 0; i < elementos.length; i++) {
                    let num = Number(elementos[i]);
                    if (isNaN(num)) {
                        fill_info("Error: La lista tiene cosas que no son números");
                        return;
                    }
                    total = total + num;
                }
                document.getElementById("n1").value = total;
                fill_info("Lista de valores procesada: se han sumado los valores. El resultado es " + total);
            }
        };

        const mediaCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                let total = 0;
                for (let i = 0; i < elementos.length; i++) {
                    let num = Number(elementos[i]);
                    if (isNaN(num)) {
                        fill_info("Error: La lista tiene cosas que no son números");
                        return;
                    }
                    total = total + num;
                }
                let media = total / elementos.length;
                document.getElementById("n1").value = media;
                fill_info("Lista de valores procesada: la media es " + media);
            }
        };

        const ordenarCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                let numeros = [];
                for (let i = 0; i < elementos.length; i++) {
                    let num = Number(elementos[i]);
                    if (isNaN(num)) {
                        fill_info("Error: La lista tiene cosas que no son números");
                        return;
                    }
                    numeros.push(num);
                }
                numeros.sort((a, b) => a - b);
                document.getElementById("n1").value = numeros.join(",");
                fill_info("Lista de valores procesada: se ha ordenado");
            }
        };

        const invertirCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                elementos.reverse();
                document.getElementById("n1").value = elementos.join(",");
                fill_info("Lista de valores procesada: se ha invertido");
            }
        };

        const borrarUltimoCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                elementos.pop();
                document.getElementById("n1").value = elementos.join(",");
                fill_info("Lista de valores procesada: se borró el último elemento");
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById("square").addEventListener("click", square);
            document.getElementById("modulo").addEventListener("click", mod);
            document.getElementById("factorial").addEventListener("click", fact);
            document.getElementById("raiz").addEventListener("click", raiz);
            
            document.getElementById("suma").addEventListener("click", suma);
            document.getElementById("multiplicacion").addEventListener("click", multiplicacion);
            document.getElementById("potencia").addEventListener("click", potencia);
            document.getElementById("eq").addEventListener("click", eq);
            
            document.getElementById("csvSum").addEventListener("click", sumarCSV);
            document.getElementById("csvMedia").addEventListener("click", mediaCSV);
            document.getElementById("csvSort").addEventListener("click", ordenarCSV);
            document.getElementById("csvReverse").addEventListener("click", invertirCSV);
            document.getElementById("csvRemove").addEventListener("click", borrarUltimoCSV);

            document.addEventListener("keydown", (evento) => {
                if (evento.key === "Enter") {
                    eq();
                }
            });
        });
    </script>
</body>
</html>
