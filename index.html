<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Inteligente - TMW</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px; 
        }
        .calculator { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            max-width: 600px; 
            width: 90%; 
            text-align: center; 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .big { 
            color: #0056b3; 
            font-size: 1.2rem;
            min-height: 55px; 
            font-weight: bold;
        }
        .animar {
            animation: fadeIn 0.4s ease-out;
        }
        .error-text { color: #d9534f; } 
        
        input { 
            padding: 12px; 
            font-size: 18px; 
            width: 80%; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            transition: border-color 0.3s; 
        }
        input:focus { border-color: #0056b3; outline: none; }
        .error-border { border-color: #d9534f !important; }
        
        h3 { font-size: 16px; color: #666; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        
        button { 
            padding: 10px 15px; 
            font-size: 14px; 
            border: none; 
            border-radius: 6px; 
            background-color: #e9ecef; 
            cursor: pointer; 
            transition: all 0.2s ease-in-out; 
        }
        button:hover { background-color: #d3d9df; transform: translateY(-2px); }
        button:focus { outline: 2px solid #0056b3; outline-offset: 2px; } 
        
        .btn-equal { background-color: #0056b3; color: white; font-weight: bold; width: 100%; margin-top: 10px;}
        .btn-equal:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculadora Avanzada</h1>

        <h2 id="info" class="big" title="Información sobre el número">Esperando operación...</h2>

        <div>
            <input type="text" id="n1" placeholder="Introduce un número (ej: 5) o CSV (ej: 1,2,3)">
        </div>

        <h3>Operaciones Unarias</h3>
        <div class="btn-group">
            <button id="cubo">x³ (Cubo)</button>
            <button id="modulo">|x| (Módulo)</button>
            <button id="factorial">x! (Factorial)</button>
            <button id="sqrt">√x (Raíz) *Extra</button>
        </div>

        <h3>Operaciones Binarias</h3>
        <div class="btn-group">
            <button id="addition">Suma (+)</button>
            <button id="multiplication">Multiplicación (*)</button>
            <button id="power">Potencia (xʸ) *Extra</button>
        </div>
        <button id="eq" class="btn-equal">Resolver (=)</button>

        <h3>Operaciones con Listas (CSV)</h3>
        <div class="btn-group">
            <button id="csv-sum">Sumar Todo</button>
            <button id="csv-mean">Media *Extra</button>
            <button id="csv-sort">Ordenar</button>
            <button id="csv-rev">Invertir</button>
            <button id="csv-rem">Borrar Último</button>
        </div>
    </div>

    <script>
        let operando1 = 0;
        let operador = "";

        const fill_info = (mensaje, esError = false) => {
            let info = document.getElementById("info");
            let caja = document.getElementById("n1");
            
            info.classList.remove("animar");
            void info.offsetWidth;
            info.classList.add("animar");
            
            info.innerHTML = mensaje;
            
            if (esError) {
                info.classList.add("error-text");
                caja.classList.add("error-border");
            } else {
                info.classList.remove("error-text");
                caja.classList.remove("error-border");
            }
        };

        const validate = () => {
            let valor = document.getElementById("n1").value;
            if (valor === "") {
                fill_info("Error: El campo está vacío", true);
                return false;
            }
            return true;
        };

        const cubo = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                let res = num * num * num;
                document.getElementById("n1").value = res;
                
                if (res < 100) {
                    fill_info("Info: El resultado es menor que 100");
                } else if (res >= 100 && res <= 200) {
                    fill_info("Info: El resultado está entre 100 y 200");
                } else {
                    fill_info("Info: El resultado es mayor que 200");
                }
            }
        };

        const mod = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                if (num < 0) {
                    num = -num;
                }
                document.getElementById("n1").value = num;
                fill_info("Operación: Módulo. El resultado es " + num);
            }
        };

        const fact = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num) || num < 0 || !Number.isInteger(num)) {
                    fill_info("Error: El factorial debe ser un número entero positivo", true);
                    return;
                }
                let res = 1;
                for (let i = num; i > 1; i--) {
                    res = res * i;
                }
                document.getElementById("n1").value = res;
                fill_info("Operación: Factorial. El resultado es " + res);
            }
        };

        const sqrt = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                if (num < 0) {
                    fill_info("Error: No existe raíz de número negativo", true);
                    return;
                }
                let res = Math.sqrt(num);
                document.getElementById("n1").value = res;
                fill_info("Operación: Raíz. El resultado es " + res);
            }
        };

        const suma = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                operando1 = num;
                operador = "+";
                document.getElementById("n1").value = "";
                fill_info("Operación: Suma. Introduce el segundo número");
            }
        };

        const multiplicacion = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                operando1 = num;
                operador = "*";
                document.getElementById("n1").value = "";
                fill_info("Operación: Multiplicación. Introduce el segundo número");
            }
        };

        const potencia = () => {
            if (validate()) {
                let num = Number(document.getElementById("n1").value);
                if (isNaN(num)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                operando1 = num;
                operador = "^";
                document.getElementById("n1").value = "";
                fill_info("Operación: Potencia. Introduce el exponente");
            }
        };

        const eq = () => {
            if (validate()) {
                let numero2 = Number(document.getElementById("n1").value);
                if (isNaN(numero2)) {
                    fill_info("Error: Introduce un número válido", true);
                    return;
                }
                let res = 0;
                let nombre = "";
                
                if (operador === "+") {
                    res = operando1 + numero2;
                    nombre = "Suma";
                } else if (operador === "*") {
                    res = operando1 * numero2;
                    nombre = "Multiplicación";
                } else if (operador === "^") {
                    res = Math.pow(operando1, numero2);
                    nombre = "Potencia";
                } else {
                    fill_info("Error: Selecciona una operación primero", true);
                    return;
                }
                
                document.getElementById("n1").value = res;
                fill_info("Operación: " + nombre + ". El resultado es " + res);
                operador = "";
            }
        };

        const sumarCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                let total = 0;
                for (let i = 0; i < elementos.length; i++) {
                    let num = Number(elementos[i]);
                    if (isNaN(num)) {
                        fill_info("Error: La lista contiene valores no numéricos", true);
                        return;
                    }
                    total = total + num;
                }
                document.getElementById("n1").value = total;
                fill_info("Lista CSV: se han sumado los valores. Resultado: " + total);
            }
        };

        const mediaCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                let total = 0;
                for (let i = 0; i < elementos.length; i++) {
                    let num = Number(elementos[i]);
                    if (isNaN(num)) {
                        fill_info("Error: La lista contiene valores no numéricos", true);
                        return;
                    }
                    total = total + num;
                }
                let media = total / elementos.length;
                document.getElementById("n1").value = media;
                fill_info("Lista CSV: media calculada. Resultado: " + media);
            }
        };

        const ordenarCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                let numeros = [];
                for (let i = 0; i < elementos.length; i++) {
                    let num = Number(elementos[i]);
                    if (isNaN(num)) {
                        fill_info("Error: La lista contiene valores no numéricos", true);
                        return;
                    }
                    numeros.push(num);
                }
                numeros.sort((a, b) => a - b);
                document.getElementById("n1").value = numeros.join(",");
                fill_info("Lista CSV: valores ordenados");
            }
        };

        const invertirCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                for (let i = 0; i < elementos.length; i++) {
                    if (isNaN(Number(elementos[i]))) {
                        fill_info("Error: La lista contiene valores no numéricos", true);
                        return;
                    }
                }
                elementos.reverse();
                document.getElementById("n1").value = elementos.join(",");
                fill_info("Lista CSV: orden invertido");
            }
        };

        const borrarUltimoCSV = () => {
            if (validate()) {
                let texto = document.getElementById("n1").value;
                let elementos = texto.split(",");
                for (let i = 0; i < elementos.length; i++) {
                    if (isNaN(Number(elementos[i]))) {
                        fill_info("Error: La lista contiene valores no numéricos", true);
                        return;
                    }
                }
                elementos.pop();
                document.getElementById("n1").value = elementos.join(",");
                fill_info("Lista CSV: último elemento borrado");
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById("cubo").addEventListener("click", cubo);
            document.getElementById("modulo").addEventListener("click", mod);
            document.getElementById("factorial").addEventListener("click", fact);
            document.getElementById("sqrt").addEventListener("click", sqrt);
            
            document.getElementById("addition").addEventListener("click", suma);
            document.getElementById("multiplication").addEventListener("click", multiplicacion);
            document.getElementById("power").addEventListener("click", potencia);
            document.getElementById("eq").addEventListener("click", eq);
            
            document.getElementById("csv-sum").addEventListener("click", sumarCSV);
            document.getElementById("csv-mean").addEventListener("click", mediaCSV);
            document.getElementById("csv-sort").addEventListener("click", ordenarCSV);
            document.getElementById("csv-rev").addEventListener("click", invertirCSV);
            document.getElementById("csv-rem").addEventListener("click", borrarUltimoCSV);

            document.addEventListener("keydown", (evento) => {
                if (evento.key === "Enter") {
                    eq();
                }
            });
        });
    </script>
</body>
</html>
